version: 2
updates:
  - package-ecosystem: 'maven'
    directory: '/'
    schedule:
      interval: 'daily'
    allow:
      - dependency-name: 'org.springframework.boot:*'
        update-types:
          - 'version-update:semver-patch'
    groups:
      spring-boot-updates:
        patterns:
          - 'org.springframework.boot:*'
        update-types:
          - patch
    commit-message:
      prefix: 'chore: '
